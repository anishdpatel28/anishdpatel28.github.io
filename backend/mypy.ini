[mypy]
python_version = 3.9
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True

[mypy-django.*]
ignore_missing_imports = True

[mypy-django.db.models.*]
ignore_missing_imports = True

[mypy-django.db.models.fields.*]
ignore_missing_imports = True 

[mypy-pageviews.migrations.*]
ignore_errors = True 