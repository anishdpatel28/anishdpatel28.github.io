name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

env:
  POSTHOG_HOST: "https://us.posthog.com"
  DEBUG: "False"
  ALLOWED_HOSTS: "localhost,127.0.0.1"
  VITE_API_URL: "http://localhost:8000/api"
  VITE_POSTHOG_HOST: "https://us.posthog.com"
  DATABASE_URL: "sqlite:///db.sqlite3"
  DJANGO_SECRET_KEY: "testsecret"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend linters
        run: pip install flake8 black isort mypy

      - name: Backend lint
        run: |
          cd backend
          flake8 .
          black --check .
          isort --check-only .
          mypy .

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Frontend lint
        run: cd frontend && npm run lint

  test:
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Docker images
        run: docker compose build

      - name: Apply migrations
        run: docker compose run --rm -e DATABASE_URL=$DATABASE_URL backend python manage.py migrate --noinput

      - name: Run backend tests
        run: docker compose run --rm -e DATABASE_URL=$DATABASE_URL backend python manage.py test --keepdb

      - name: Run frontend tests
        run: |
          cd frontend
          npm ci
          npm run test

      - name: Stop services
        if: always()
        run: docker compose down -v

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build, lint, test]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:8000/api' }}
        run: cd frontend && npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
