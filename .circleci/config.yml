version: 2.1

env: &common-env
  POSTHOG_HOST: "https://us.posthog.com"
  DEBUG: "False"
  ALLOWED_HOSTS: "localhost,127.0.0.1"
  VITE_API_URL: "http://localhost:8000/api"
  VITE_POSTHOG_HOST: "https://us.posthog.com"
  DATABASE_URL: "sqlite:///db.sqlite3"
  DJANGO_SECRET_KEY: "testsecret"

jobs:
  build:
    resource_class: medium
    docker:
      - image: cimg/base:stable
        environment: *common-env
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker images
          command: docker compose build

  test:
    resource_class: medium
    docker:
      - image: cimg/base:stable
        environment: *common-env
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker images
          command: docker compose build
      - run:
          name: DEBUG - List files in /app
          command: docker compose run --rm backend ls -la /app
      - run:
          name: Apply migrations
          command: docker compose run --rm backend python manage.py migrate --noinput
      - run:
          name: Run backend tests
          command: docker compose run --rm backend python manage.py test --keepdb
      - run:
          name: Run frontend tests
          command: docker compose run --rm --workdir /app frontend npm run test
      - run:
          name: Stop services
          command: docker compose down -v

  lint:
    docker:
      - image: cimg/python:3.10-node
        environment: *common-env
    steps:
      - checkout
      - run:
          name: Install backend linters
          command: pip install flake8 black isort mypy
      - run:
          name: Backend lint
          command: |
            cd backend
            flake8 .
            black --check .
            isort --check-only .
            mypy .
      - run:
          name: Install frontend dependencies
          command: cd frontend && npm ci
      - run:
          name: Frontend lint
          command: cd frontend && npm run lint

workflows:
  version: 2
  pipeline:
    jobs:
      - build
      - lint:
          requires:
            - build
      - test:
          requires:
            - lint 